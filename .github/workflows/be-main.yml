name: (main) [be] Deploy to Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend-main/**'
      - '.github/workflows/be-main.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: cd backend-main && npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          cd backend-main
          # Update wrangler.jsonc with environment variables using sed
          sed -i "s|\"AUTH_MS_URL\":[[:space:]]*\"[^\"]*\"|\"AUTH_MS_URL\": \"${{ vars.AUTH_MS_URL }}\"|g" wrangler.jsonc
          sed -i "s|\"database_id\":[[:space:]]*\"[^\"]*\"|\"database_id\": \"${{ vars.CLOUDFLARE_D1_DATABASE_ID }}\"|g" wrangler.jsonc
          
          echo "Successfully updated wrangler.jsonc with environment variables"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd backend-main
          cat wrangler.jsonc >> wrangler.local.jsonc
          wrangler deploy --config wrangler.local.jsonc

