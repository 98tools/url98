name: (dev) [ms] Deploy to Cloudflare Worker

on:
  push:
    branches:
      - dev
    paths:
      - 'backend-domain-ms/**'
      - '.github/workflows/ms-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: cd backend-domain-ms && npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables && Update name to append dev
        run: |
          cd backend-domain-ms

          jq '.d1_databases |= map(
              if .binding == "URL_DB" then 
                  .database_id = "${{ vars.URL_DATABASE_ID }}" 
              elif .binding == "AUTH_DB" then 
                  .database_name = "${{ vars.AUTH_DB_NAME }}" | .database_id = "${{ vars.AUTH_DATABASE_ID }}" 
              else 
                  . 
              end
          ) | .name += "-dev"' wrangler.jsonc > wrangler2.jsonc && mv wrangler2.jsonc wrangler.jsonc

          echo "Successfully updated wrangler.jsonc with environment variables"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd backend-domain-ms
          cat wrangler.jsonc >> wrangler.local.jsonc
          wrangler deploy --config wrangler.local.jsonc

